site_name: quantbench
site_description: Unified from-scratch quantization engine, bit-packing runtime, 2:4 sparsity toolkit, and Quality-vs-Speed Pareto evaluation benchmark.
site_author: Prajwal Pujari
site_url: https://prajwal7-2002.github.io/quantbench/
repo_url: https://github.com/Prajwal7-2002/quantbench
repo_name: Prajwal7-2002/quantbench

theme:
  name: material
  palette:
    - scheme: slate
      primary: emerald
      accent: teal
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
    - scheme: default
      primary: emerald
      accent: teal
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - content.code.copy
    - content.code.annotate

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.arithmatex:
      generic: true
  - tables
  - admonition

extra_javascript:
  - https://polyfill.io/v3/polyfill.min.js?features=es6
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js

nav:
  - Overview: index.md
  - Mathematical Foundations: math-foundations.md
  - Sub-Byte Bit-Packing: bit-packing.md
  - 2:4 Structured Sparsity: sparsity-24.md
  - Advanced Calibration: calibration.md
  - Drop-in QuantLinear Layers: quant-linear.md
  - Pareto Evaluation: pareto-eval.md
