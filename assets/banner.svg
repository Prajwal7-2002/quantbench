<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <!-- Background Canvas Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#04080d"/>
      <stop offset="40%" stop-color="#081420"/>
      <stop offset="100%" stop-color="#0d2235"/>
    </linearGradient>

    <!-- Brand High-Contrast Gradient -->
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="40%" stop-color="#a7f3d0"/>
      <stop offset="80%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#84cc16"/>
    </linearGradient>

    <!-- Emerald / Cyan Quant Gradient -->
    <linearGradient id="quantGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="50%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>

    <linearGradient id="paretoGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="50%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#84cc16"/>
    </linearGradient>

    <!-- Card Backgrounds -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#081522" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#040b12" stop-opacity="0.9"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="emeraldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="360" rx="20" fill="url(#bgGrad)"/>
  <rect width="1200" height="360" rx="20" fill="none" stroke="#10b981" stroke-width="1.5" stroke-opacity="0.3"/>

  <!-- Blueprint CAD Grid Pattern -->
  <g opacity="0.08" stroke="#06b6d4" stroke-width="1">
    <line x1="0" y1="40" x2="1200" y2="40"/>
    <line x1="0" y1="80" x2="1200" y2="80"/>
    <line x1="0" y1="120" x2="1200" y2="120"/>
    <line x1="0" y1="160" x2="1200" y2="160"/>
    <line x1="0" y1="200" x2="1200" y2="200"/>
    <line x1="0" y1="240" x2="1200" y2="240"/>
    <line x1="0" y1="280" x2="1200" y2="280"/>
    <line x1="0" y1="320" x2="1200" y2="320"/>

    <line x1="60" y1="0" x2="60" y2="360"/>
    <line x1="120" y1="0" x2="120" y2="360"/>
    <line x1="180" y1="0" x2="180" y2="360"/>
    <line x1="240" y1="0" x2="240" y2="360"/>
    <line x1="300" y1="0" x2="300" y2="360"/>
    <line x1="360" y1="0" x2="360" y2="360"/>
    <line x1="420" y1="0" x2="420" y2="360"/>
    <line x1="480" y1="0" x2="480" y2="360"/>
    <line x1="540" y1="0" x2="540" y2="360"/>
    <line x1="600" y1="0" x2="600" y2="360"/>
    <line x1="660" y1="0" x2="660" y2="360"/>
    <line x1="720" y1="0" x2="720" y2="360"/>
    <line x1="780" y1="0" x2="780" y2="360"/>
    <line x1="840" y1="0" x2="840" y2="360"/>
    <line x1="900" y1="0" x2="900" y2="360"/>
    <line x1="960" y1="0" x2="960" y2="360"/>
    <line x1="1020" y1="0" x2="1020" y2="360"/>
    <line x1="1080" y1="0" x2="1080" y2="360"/>
    <line x1="1140" y1="0" x2="1140" y2="360"/>
  </g>

  <!-- LEFT HERO SECTION -->
  <!-- Brand Logo Icon (replicated cleanly) -->
  <g transform="translate(60, 60)">
    <!-- Squircle badge -->
    <rect x="0" y="0" width="100" height="100" rx="26" fill="#06121d" stroke="#10b981" stroke-width="2" stroke-opacity="0.5"/>
    
    <!-- Precision Quant Ring -->
    <circle cx="50" cy="50" r="32" fill="none" stroke="url(#quantGrad)" stroke-width="7" stroke-linecap="round" filter="url(#subtleGlow)"/>
    <line x1="68" y1="68" x2="82" y2="82" stroke="url(#quantGrad)" stroke-width="6" stroke-linecap="round"/>

    <!-- Discrete Level Markers -->
    <circle cx="36" cy="50" r="3.5" fill="#10b981"/>
    <circle cx="50" cy="50" r="4.5" fill="#38bdf8"/>
    <circle cx="64" cy="50" r="3.5" fill="#84cc16"/>
  </g>

  <!-- Typography Block -->
  <g transform="translate(180, 70)">
    <!-- Product Tag -->
    <rect x="0" y="0" width="165" height="22" rx="11" fill="#09202a" stroke="#10b981" stroke-width="1"/>
    <text x="12" y="15" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', monospace" font-size="11" font-weight="700" fill="#34d399" letter-spacing="1.5">PRODUCTION ML</text>
    <circle cx="145" cy="11" r="3" fill="#10b981"/>

    <!-- Main Title -->
    <text x="0" y="66" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="52" font-weight="900" fill="url(#titleGrad)" letter-spacing="-1.5">
      quantbench
    </text>

    <!-- Subtitle -->
    <text x="2" y="98" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="15.5" font-weight="500" fill="#94a3b8" letter-spacing="0.2">
      First-Principles Quantization Engine &amp; Pareto Frontier Benchmark
    </text>

    <!-- Feature Tags Row -->
    <g transform="translate(0, 130)">
      <!-- Tag 1: INT4 / INT8 / FP8 -->
      <g>
        <rect x="0" y="0" width="118" height="28" rx="6" fill="#081824" stroke="#10b981" stroke-width="1.2" stroke-opacity="0.6"/>
        <text x="12" y="18" font-family="'JetBrains Mono', monospace" font-size="11.5" font-weight="700" fill="#6ee7b7">INT4 · INT8 · FP8</text>
      </g>

      <!-- Tag 2: BitNet b1.58 -->
      <g transform="translate(126, 0)">
        <rect x="0" y="0" width="134" height="28" rx="6" fill="#081824" stroke="#06b6d4" stroke-width="1.2" stroke-opacity="0.6"/>
        <text x="12" y="18" font-family="'JetBrains Mono', monospace" font-size="11.5" font-weight="700" fill="#67e8f9">BitNet b1.58 Ternary</text>
      </g>

      <!-- Tag 3: 2:4 Sparsity -->
      <g transform="translate(268, 0)">
        <rect x="0" y="0" width="128" height="28" rx="6" fill="#081824" stroke="#84cc16" stroke-width="1.2" stroke-opacity="0.6"/>
        <text x="12" y="18" font-family="'JetBrains Mono', monospace" font-size="11.5" font-weight="700" fill="#bef264">2:4 Sparse Ampere</text>
      </g>

      <!-- Tag 4: AWQ & GPTQ -->
      <g transform="translate(404, 0)">
        <rect x="0" y="0" width="124" height="28" rx="6" fill="#081824" stroke="#38bdf8" stroke-width="1.2" stroke-opacity="0.6"/>
        <text x="12" y="18" font-family="'JetBrains Mono', monospace" font-size="11.5" font-weight="700" fill="#7dd3fc">SmoothQuant · AWQ</text>
      </g>
    </g>

    <!-- Technical Callout Equation -->
    <g transform="translate(0, 185)">
      <text x="0" y="16" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="600" fill="#64748b">
        W_quant = clamp(round(W / scale) + zero_point, qmin, qmax)
      </text>
      <text x="0" y="34" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="500" fill="#10b981" opacity="0.8">
        ✓ 100% Pure PyTorch &amp; Python · Zero Compiled CUDA / C++ C-Extensions
      </text>
    </g>
  </g>

  <!-- RIGHT CAD BENCHMARK & PARETO PLOT PANEL -->
  <g transform="translate(760, 40)">
    <!-- Container Card -->
    <rect x="0" y="0" width="390" height="280" rx="14" fill="url(#cardGrad)" stroke="#10b981" stroke-width="1.2" stroke-opacity="0.4"/>

    <!-- Panel Header -->
    <g transform="translate(20, 24)">
      <circle cx="4" cy="4" r="4" fill="#10b981"/>
      <text x="16" y="8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', monospace" font-size="11.5" font-weight="700" fill="#e2e8f0" letter-spacing="0.5">EMPIRICAL PARETO FRONTIER</text>
      <text x="270" y="8" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="600" fill="#06b6d4">PPL vs SPEEDUP</text>
    </g>

    <!-- Pareto Chart Axes & Grid -->
    <g transform="translate(30, 60)">
      <!-- Axes -->
      <line x1="30" y1="20" x2="30" y2="160" stroke="#334155" stroke-width="1.5"/>
      <line x1="30" y1="160" x2="330" y2="160" stroke="#334155" stroke-width="1.5"/>

      <!-- Grid lines -->
      <line x1="30" y1="60" x2="330" y2="60" stroke="#1e293b" stroke-width="1" stroke-dasharray="2 3"/>
      <line x1="30" y1="110" x2="330" y2="110" stroke="#1e293b" stroke-width="1" stroke-dasharray="2 3"/>
      <line x1="130" y1="20" x2="130" y2="160" stroke="#1e293b" stroke-width="1" stroke-dasharray="2 3"/>
      <line x1="230" y1="20" x2="230" y2="160" stroke="#1e293b" stroke-width="1" stroke-dasharray="2 3"/>

      <!-- Axis Labels -->
      <text x="180" y="178" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="600" fill="#64748b" text-anchor="middle">Throughput Speedup (tok/s) →</text>
      <text x="22" y="16" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="600" fill="#64748b" text-anchor="end">PPL (Lower = Better)</text>

      <!-- Empirical Pareto Curve -->
      <path d="M 50 140 Q 110 135 170 115 T 260 70 T 310 35" fill="none" stroke="url(#paretoGrad)" stroke-width="3" filter="url(#subtleGlow)"/>

      <!-- Plotted Benchmark Points -->
      <!-- Point 1: FP16 Baseline -->
      <circle cx="50" cy="140" r="5" fill="#38bdf8" stroke="#04080d" stroke-width="1.5"/>
      <text x="56" y="144" font-family="'JetBrains Mono', monospace" font-size="8.5" font-weight="700" fill="#93c5fd">FP16 (1.0x)</text>

      <!-- Point 2: SmoothQuant INT8 -->
      <circle cx="130" cy="130" r="5" fill="#10b981" stroke="#04080d" stroke-width="1.5"/>
      <text x="136" y="126" font-family="'JetBrains Mono', monospace" font-size="8.5" font-weight="700" fill="#6ee7b7">INT8 (+1.8x)</text>

      <!-- Point 3: AWQ 4-bit -->
      <circle cx="210" cy="105" r="5" fill="#06b6d4" stroke="#04080d" stroke-width="1.5"/>
      <text x="216" y="100" font-family="'JetBrains Mono', monospace" font-size="8.5" font-weight="700" fill="#67e8f9">AWQ-4b (+2.9x)</text>

      <!-- Point 4: 2:4 Sparse + INT4 -->
      <circle cx="280" cy="65" r="5.5" fill="#84cc16" stroke="#04080d" stroke-width="1.5"/>
      <text x="286" y="60" font-family="'JetBrains Mono', monospace" font-size="8.5" font-weight="800" fill="#bef264">2:4+INT4 (+4.2x)</text>
    </g>

    <!-- Bottom Memory Compression Gauge -->
    <g transform="translate(25, 230)">
      <rect x="0" y="0" width="340" height="28" rx="6" fill="#06121d" stroke="#1e293b" stroke-width="1"/>
      
      <!-- Compression Bar Segments -->
      <!-- FP32: 100% -->
      <rect x="4" y="4" width="75" height="20" rx="4" fill="#38bdf8" fill-opacity="0.8"/>
      <text x="41" y="17" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="800" fill="#04090e" text-anchor="middle">FP32 32b</text>

      <!-- INT8: 25% -->
      <rect x="83" y="4" width="75" height="20" rx="4" fill="#10b981" fill-opacity="0.85"/>
      <text x="120" y="17" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="800" fill="#04090e" text-anchor="middle">INT8 8b</text>

      <!-- INT4: 12.5% -->
      <rect x="162" y="4" width="75" height="20" rx="4" fill="#06b6d4" fill-opacity="0.9"/>
      <text x="199" y="17" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="800" fill="#04090e" text-anchor="middle">INT4 4b</text>

      <!-- BitNet: 5% -->
      <rect x="241" y="4" width="95" height="20" rx="4" fill="#84cc16" fill-opacity="0.95"/>
      <text x="288" y="17" font-family="'JetBrains Mono', monospace" font-size="9" font-weight="800" fill="#04090e" text-anchor="middle">BitNet 1.58b</text>
    </g>
  </g>
</svg>
