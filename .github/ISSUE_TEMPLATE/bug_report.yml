name: "🐛 Bug Report"
description: "Report a bug, numerical error, or bit-packing discrepancy in quantbench-engine"
title: "[Bug]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting an issue in `quantbench-engine`! Please ensure you are running the latest version.

  - type: textarea
    id: description
    attributes:
      label: Description of the Bug
      description: What went wrong during quantization, packing, or model conversion?
      placeholder: "When quantizing a linear layer with INT4 and group_size=32..."
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Minimal Steps to Reproduce
      description: Exact CLI command or minimal Python code snippet reproducing the numerical or execution issue.
      placeholder: |
        import torch
        from quantbench.quant.packing import pack_int4, unpack_int4
        # ...
    validations:
      required: true

  - type: textarea
    id: traceback
    attributes:
      label: Error Traceback / Logs
      description: Paste the console traceback inside a code block.
      render: shell
    validations:
      required: false

  - type: textarea
    id: environment
    attributes:
      label: Environment Diagnostics
      description: Details about your environment.
      placeholder: |
        - OS: Windows 11 / Ubuntu 22.04 / macOS
        - Python Version: (e.g. 3.12.10)
        - PyTorch Version: (e.g. 2.5.1)
        - Device: (CUDA / CPU / MPS)
        - quantbench-engine Version: (e.g. 0.1.2)
    validations:
      required: true

  - type: checkboxes
    id: confirmation
    attributes:
      label: Validation Checklist
      options:
        - label: I have verified this bug occurs on the latest `main` branch or PyPI release.
          required: true
        - label: I have checked open/closed issues to avoid duplicates.
          required: true
        - label: I am willing to submit a Pull Request to fix this.
          required: false
